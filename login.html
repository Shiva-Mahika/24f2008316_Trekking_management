<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
        <link rel="stylesheet" href="styles.css">

<!-- <link rel="stylesheet" href=""> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<style>
    body {
    background-image: url("background.jpg");
    background-size: cover;       
    background-position: center;
    background-repeat: no-repeat; 
    margin: 0;
}

    #form-body{
    border: 5px black;
    width: 300px;
    height: 400px;
    margin: auto;
    border-radius: 5px;
    margin-top: 200px;
    padding:10px;
}
    
</style>
</head>
<body>
    <div id="main">
        <div id="canvas">

            <div id="content">
            <h1 style="font-family: Georgia, serif;justify-content: center;">  Welcome to TrekTrails</h1>
            <div id="form-body">
                <h2>Login Form</h2>
                <form action="/login" method="post">
                    {% if error %}
    <div class="alert alert-danger">{{error}}</div>
    {% endif %}
                <div class="mb-3">
                <label for="Input1" class="form-label">Email</label>
                <input type="text" class="form-control" id="Input1" placeholder="Enter your Email" name="email">
                </div>
                <div class="mb-3">
                <label for="Input2" class="form-label">Password</label>
                <input type="password" class="form-control" id="Input2" placeholder="Enter your password" name="password">
                </div>
                <div class="text-center">
                    <input type="submit" class="btn btn-primary" value="Login">
                    <br>
                    Are you new <a href="register.html">Register here</a>
                </div>
                </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
