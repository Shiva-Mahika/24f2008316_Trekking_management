<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Trek</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<style>
    body {
    background-image: url("back.png");
    background-size: cover;       
    background-position: center;
    background-repeat: no-repeat; 
    margin: 0;
    }
</style>
</head>

<body>
    <div class="row justify-content-center">
    <div class="col-md-6">
    <div class="card p-4">
    
            <div id="form-body">
                <h2>Booking for a Trek </h2>
                <div class="mb-3">
                <label for="Input1" class="form-label">Trek Name</label>
                <input type="text" class="form-control" id="Input1" placeholder="Enter Trek Name">
                </div>
                <div class="mb-3">
                <label for="Input2" class="form-label">date</label>
                <input type="date" class="form-control" id="Input2" placeholder="Enter ">
                </div>
                <div class="mb-3">
                <label for="Input3" class="form-label">Duration</label>
                <input type="number" class="form-control" id="Input3" placeholder="Enter Duration of Trek">
                </div>

                <div class="text-center">
                    <input type="submit" class="btn btn-primary" value="Create">
                    
                    
                </div>

            </div>
        </div>
        </div>
    </div>
