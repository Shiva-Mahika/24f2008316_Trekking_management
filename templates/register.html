<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<style>
    body {
    background-image: url("background.jpg");
    background-size: cover;       
    background-position: center;
    background-repeat: no-repeat; 
    margin: 0;
}

    #form-body{
    border: 5px black;
    width: 300px;
    height: 400px;
    margin: auto;
    border-radius: 5px;
    margin-top: 200px;
    padding:10px;
}
    
</style>
</head>
<body>
    <div class="row justify-content-center">
    <div class="col-md-6">
    <div class="card p-4">
                    <h1 style="font-family: Georgia, serif;justify-content: center;">  Welcome to TrekTrails</h1>

    
    <h3 class="mb-3">Create Account</h3>

    {% if error %}
    <div class="alert alert-danger">{{error}}</div>
    {% endif %}
    <form method="POST">
       
        </div>

        <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="name" name="name" class="form-control" placeholder="Enter your name here" required>
        </div>
        <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="name" name="name" class="form-control" placeholder="Enter your phone number here" name="ph_number">
        </div>

        <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="Enter email here" required>
        </div>
        <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
        </div>
         <div class="mb-3">
        <label class="form-label">You are a</label>
        <select name="role" id="roleSelect" class="form-select" required>
            <option value="student">Staff</option>
            <option value="company">User</option>
        </select>
        <br>
        <br>
        <button type="submit" class="btn btn-success">submit</button>
        
    </form>
    </div>
    </div>
</div>
</body>
</html>
